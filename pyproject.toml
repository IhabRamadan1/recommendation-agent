[project]
name = "recommendation-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ihab Ramadan", email = "114080300+IhabRamadan1@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-core>=1.5.5",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
recommendation-agent = "recommendation_agent:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
